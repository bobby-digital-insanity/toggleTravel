<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F8F8F8"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A9FF5E"/>
    </marker>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7084FF"/>
      <stop offset="1" stop-color="#405BFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="900" fill="#191919"/>

  <!-- Title -->
  <text x="48" y="58" font-size="30" font-weight="800" fill="#F8F8F8">AI Planner — how one turn works behind the scenes</text>
  <text x="48" y="90" font-size="16" fill="#A7A9AC">The app asks LaunchDarkly six questions on every request. None of the answers are hard-coded.</text>
  <rect x="48" y="104" width="220" height="4" rx="2" fill="url(#title-grad)"/>

  <!-- Lane headers -->
  <g font-size="12" font-weight="700" letter-spacing="1.5">
    <text x="48"   y="150" fill="#7084FF">BROWSER</text>
    <text x="388"  y="150" fill="#7084FF">TOGGLE TRAVEL APP</text>
    <text x="768"  y="150" fill="#7084FF">LAUNCHDARKLY</text>
    <text x="1288" y="150" fill="#7084FF">MODEL PROVIDERS</text>
  </g>
  <g stroke="#2C2C2C" stroke-width="1">
    <line x1="48" y1="160" x2="328" y2="160"/>
    <line x1="388" y1="160" x2="708" y2="160"/>
    <line x1="768" y1="160" x2="1228" y2="160"/>
    <line x1="1288" y1="160" x2="1552" y2="160"/>
  </g>

  <!-- ── Browser lane ─────────────────────────────────────────────── -->
  <g>
    <rect x="48" y="200" width="280" height="118" rx="14" fill="#212121" stroke="#414042"/>
    <text x="72" y="236" font-size="17" font-weight="700" fill="#F8F8F8">AI Planner page</text>
    <text x="72" y="260" font-size="13" fill="#A7A9AC">Chat UI with a live model banner</text>
    <!-- mode toggle -->
    <rect x="72" y="276" width="176" height="26" rx="13" fill="#282828" stroke="#414042"/>
    <rect x="74" y="278" width="96" height="22" rx="11" fill="#405BFF"/>
    <text x="122" y="294" font-size="11" font-weight="700" fill="#F8F8F8" text-anchor="middle">Conversation</text>
    <text x="210" y="294" font-size="11" font-weight="600" fill="#A7A9AC" text-anchor="middle">Agent</text>
  </g>
  <g>
    <rect x="48" y="720" width="280" height="80" rx="14" fill="#212121" stroke="#414042"/>
    <text x="72" y="752" font-size="16" font-weight="700" fill="#F8F8F8">Thumbs up / down</text>
    <text x="72" y="776" font-size="13" fill="#A7A9AC">Customer feedback on every reply</text>
  </g>

  <!-- ── App lane ─────────────────────────────────────────────────── -->
  <g>
    <rect x="388" y="200" width="320" height="150" rx="14" fill="#212121" stroke="#405BFF" stroke-width="1.5" filter="url(#glow)"/>
    <text x="412" y="236" font-size="17" font-weight="700" fill="#F8F8F8">Planner API</text>
    <text x="412" y="262" font-size="13" fill="#A7A9AC">Classifies, resolves config, calls the</text>
    <text x="412" y="282" font-size="13" fill="#A7A9AC">served model, runs judges, reports back.</text>
    <text x="412" y="318" font-size="12" font-weight="600" fill="#7084FF">Executes what LaunchDarkly serves</text>
  </g>
  <g>
    <rect x="388" y="720" width="320" height="80" rx="14" fill="#212121" stroke="#414042"/>
    <text x="412" y="752" font-size="16" font-weight="700" fill="#F8F8F8">Tool implementations</text>
    <text x="412" y="776" font-size="13" fill="#A7A9AC">Live weather forecast · destination catalog</text>
  </g>

  <!-- ── LaunchDarkly lane ────────────────────────────────────────── -->
  <g>
    <rect x="768" y="190" width="460" height="640" rx="18" fill="#1F1F1F" stroke="#2C2C2C"/>
  </g>
  <!-- Feature flags -->
  <g>
    <rect x="792" y="212" width="412" height="76" rx="12" fill="#282828" stroke="#414042"/>
    <rect x="792" y="212" width="6" height="76" rx="3" fill="#405BFF"/>
    <text x="818" y="242" font-size="16" font-weight="700" fill="#F8F8F8">Feature flags</text>
    <text x="818" y="266" font-size="13" fill="#A7A9AC">Kill switches · agent-mode gate · judge thresholds</text>
  </g>
  <!-- AI Configs -->
  <g>
    <rect x="792" y="304" width="412" height="76" rx="12" fill="#282828" stroke="#414042"/>
    <rect x="792" y="304" width="6" height="76" rx="3" fill="#7084FF"/>
    <text x="818" y="334" font-size="16" font-weight="700" fill="#F8F8F8">AI Configs</text>
    <text x="818" y="358" font-size="13" fill="#A7A9AC">Model · prompt · parameters · targeting rules · tools</text>
  </g>
  <!-- Agent graph -->
  <g>
    <rect x="792" y="396" width="412" height="76" rx="12" fill="#282828" stroke="#414042"/>
    <rect x="792" y="396" width="6" height="76" rx="3" fill="#A34FDE"/>
    <text x="818" y="426" font-size="16" font-weight="700" fill="#F8F8F8">Agent graph</text>
    <text x="818" y="450" font-size="13" fill="#A7A9AC">Supervisor → specialists → composer · handoffs · timeouts</text>
  </g>
  <!-- Judges -->
  <g>
    <rect x="792" y="488" width="412" height="76" rx="12" fill="#282828" stroke="#414042"/>
    <rect x="792" y="488" width="6" height="76" rx="3" fill="#FF35A2"/>
    <text x="818" y="518" font-size="16" font-weight="700" fill="#F8F8F8">Judge configs</text>
    <text x="818" y="542" font-size="13" fill="#A7A9AC">Accuracy rubric · relevance / injection rubric · sampling</text>
  </g>
  <!-- Monitoring -->
  <g>
    <rect x="792" y="580" width="412" height="76" rx="12" fill="#282828" stroke="#414042"/>
    <rect x="792" y="580" width="6" height="76" rx="3" fill="#A9FF5E"/>
    <text x="818" y="610" font-size="16" font-weight="700" fill="#F8F8F8">Monitoring &amp; metrics</text>
    <text x="818" y="634" font-size="13" fill="#A7A9AC">Tokens · latency · judge scores · feedback · experiments</text>
  </g>
  <!-- LD footer note -->
  <text x="998" y="700" font-size="12" font-weight="600" fill="#EBFF38" text-anchor="middle">Everything in this column changes without a deploy</text>
  <text x="998" y="722" font-size="12" fill="#A7A9AC" text-anchor="middle">Streamed to the server SDK in seconds</text>

  <!-- ── Providers lane ───────────────────────────────────────────── -->
  <g>
    <rect x="1288" y="200" width="264" height="150" rx="14" fill="#212121" stroke="#414042"/>
    <text x="1312" y="236" font-size="17" font-weight="700" fill="#F8F8F8">Models</text>
    <g font-size="12" font-weight="700">
      <rect x="1312" y="252" width="72" height="24" rx="12" fill="#1F3D1F" stroke="#A9FF5E"/>
      <text x="1348" y="269" fill="#A9FF5E" text-anchor="middle">Cheap</text>
      <rect x="1392" y="252" width="60" height="24" rx="12" fill="#1F2A4D" stroke="#7084FF"/>
      <text x="1422" y="269" fill="#7084FF" text-anchor="middle">Mid</text>
      <rect x="1460" y="252" width="72" height="24" rx="12" fill="#3A1F4D" stroke="#A34FDE"/>
      <text x="1496" y="269" fill="#A34FDE" text-anchor="middle">Strong</text>
    </g>
    <text x="1312" y="304" font-size="13" fill="#A7A9AC">Which one answers is a targeting</text>
    <text x="1312" y="324" font-size="13" fill="#A7A9AC">rule in LaunchDarkly, not an if-statement.</text>
  </g>

  <!-- ── Arrows ───────────────────────────────────────────────────── -->
  <g fill="none" stroke="#F8F8F8" stroke-width="2" marker-end="url(#arrow)">
    <!-- Browser -> App: message -->
    <path d="M 328 240 L 386 240"/>
    <!-- App -> Browser: reply -->
    <path d="M 388 296 L 330 296"/>
    <!-- 1 App -> Flags -->
    <path d="M 708 226 L 790 246"/>
    <!-- 2 App -> AI Configs -->
    <path d="M 708 262 L 790 338"/>
    <!-- 3 App -> Agent graph -->
    <path d="M 708 298 L 790 430"/>
    <!-- 5 App -> Judges -->
    <path d="M 708 334 L 790 522"/>
    <!-- 4 App -> Providers, routed above the LD column -->
    <path d="M 548 200 L 548 176 L 1420 176 L 1420 198"/>
    <!-- Judges -> Providers (judge call) -->
    <path d="M 1204 526 L 1420 526 L 1420 352"/>
    <!-- Providers -> Tools (tool calls), routed below the LD column -->
    <path d="M 1420 350 L 1420 856 L 548 856 L 548 802"/>
  </g>
  <!-- 6 App -> Monitoring, dashed telemetry -->
  <g fill="none" stroke="#A9FF5E" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-dim)">
    <path d="M 640 350 L 640 618 L 790 618"/>
    <!-- Feedback -> Monitoring -->
    <path d="M 328 760 L 740 760 L 740 640 L 790 640"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="12" fill="#D1D3D4">
    <text x="357" y="218" text-anchor="middle">message +</text>
    <text x="357" y="231" text-anchor="middle">who the user is</text>
    <text x="359" y="318" text-anchor="middle">reply + dev view</text>
    <text x="984" y="170" text-anchor="middle" fill="#F8F8F8">call the served model</text>
    <text x="1310" y="514" text-anchor="middle">judge call</text>
    <text x="984" y="874" text-anchor="middle" fill="#F8F8F8">tool calls (the model asks the app for real data)</text>
    <text x="358" y="752" text-anchor="middle" fill="#A9FF5E">feedback</text>
  </g>

  <!-- Numbered badges on the six questions -->
  <g font-size="13" font-weight="800" text-anchor="middle">
    <circle cx="742" cy="222" r="13" fill="#405BFF"/><text x="742" y="227" fill="#F8F8F8">1</text>
    <circle cx="748" cy="290" r="13" fill="#405BFF"/><text x="748" y="295" fill="#F8F8F8">2</text>
    <circle cx="754" cy="356" r="13" fill="#405BFF"/><text x="754" y="361" fill="#F8F8F8">3</text>
    <circle cx="760" cy="420" r="13" fill="#405BFF"/><text x="760" y="425" fill="#F8F8F8">5</text>
    <circle cx="548" cy="176" r="13" fill="#405BFF"/><text x="548" y="181" fill="#F8F8F8">4</text>
    <circle cx="640" cy="470" r="13" fill="#A9FF5E"/><text x="640" y="475" fill="#191919">6</text>
  </g>

  <!-- Legend: the six questions -->
  <g font-size="13">
    <rect x="48" y="380" width="280" height="300" rx="14" fill="#212121" stroke="#414042"/>
    <text x="72" y="412" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7084FF">THE SIX QUESTIONS</text>
    <g fill="#F8F8F8">
      <circle cx="80" cy="444" r="10" fill="#405BFF"/><text x="80" y="448" font-size="11" font-weight="800" text-anchor="middle">1</text>
      <text x="100" y="448">May I run?  <tspan fill="#A7A9AC">flags</tspan></text>
      <circle cx="80" cy="480" r="10" fill="#405BFF"/><text x="80" y="484" font-size="11" font-weight="800" text-anchor="middle">2</text>
      <text x="100" y="484">Which model, which prompt?  <tspan fill="#A7A9AC">AI Config</tspan></text>
      <circle cx="80" cy="516" r="10" fill="#405BFF"/><text x="80" y="520" font-size="11" font-weight="800" text-anchor="middle">3</text>
      <text x="100" y="520">Which team, which tools?  <tspan fill="#A7A9AC">graph</tspan></text>
      <circle cx="80" cy="552" r="10" fill="#405BFF"/><text x="80" y="556" font-size="11" font-weight="800" text-anchor="middle">4</text>
      <text x="100" y="556">Call the served model</text>
      <circle cx="80" cy="588" r="10" fill="#405BFF"/><text x="80" y="592" font-size="11" font-weight="800" text-anchor="middle">5</text>
      <text x="100" y="592">Is the answer good enough?  <tspan fill="#A7A9AC">judges</tspan></text>
      <circle cx="80" cy="624" r="10" fill="#A9FF5E"/><text x="80" y="628" font-size="11" font-weight="800" text-anchor="middle" fill="#191919">6</text>
      <text x="100" y="628">Report every call back  <tspan fill="#A7A9AC">metrics</tspan></text>
    </g>
    <line x1="72" y1="646" x2="304" y2="646" stroke="#414042"/>
    <line x1="72" y1="664" x2="100" y2="664" stroke="#F8F8F8" stroke-width="2"/>
    <text x="108" y="668" fill="#A7A9AC">request</text>
    <line x1="176" y1="664" x2="204" y2="664" stroke="#A9FF5E" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="212" y="668" fill="#A7A9AC">telemetry</text>
  </g>

  <!-- Footer -->
  <text x="1552" y="880" font-size="11" fill="#6D6E71" text-anchor="end">Toggle Travel · LaunchDarkly AI Configs demo</text>
</svg>
