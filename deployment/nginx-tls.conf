# TLS config — used by the deploy workflow ONLY once
# /etc/letsencrypt/live/toggletravel-sentry.launchdarklydemos.com/fullchain.pem
# exists. See deployment/nginx.conf for why this is a separate file.
#
# Getting the cert (run once, on the box):
#   1. Route 53: A record toggletravel-sentry -> this EC2's public IP, TTL 300
#   2. EC2 security group: allow inbound 443 from 0.0.0.0/0
#   3. certbot via pip (AL2023 has no dnf package): venv at /opt/certbot,
#      symlink into /usr/bin/certbot
#   4. sudo certbot certonly --nginx -d toggletravel-sentry.launchdarklydemos.com
#      Use `certonly` — NOT `--nginx` ownership of the config. Every deploy
#      copies this file over /etc/nginx/conf.d/, so certbot's own edits to the
#      live config would be clobbered.
#   5. Auto-renewal via systemd timer (AL2023 has no cron by default):
#      certbot renew -q --deploy-hook "systemctl reload nginx", twice daily.
#      Renewals rewrite the same paths, so this file never needs to change.

# HTTP: serve ACME renewals, redirect everything else to HTTPS.
server {
    listen 80 default_server;
    server_name toggletravel-sentry.launchdarklydemos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/toggle-travel/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name toggletravel-sentry.launchdarklydemos.com;

    ssl_certificate     /etc/letsencrypt/live/toggletravel-sentry.launchdarklydemos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toggletravel-sentry.launchdarklydemos.com/privkey.pem;

    root /var/www/toggle-travel/public;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/demo/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
