# HTTP-only config. This is the config a FRESH box gets, before a TLS cert
# exists. The deploy workflow picks this file when
# /etc/letsencrypt/live/<domain>/fullchain.pem is absent, and switches to
# nginx-tls.conf once the cert is there.
#
# This split exists on purpose: referencing a cert path that doesn't exist yet
# makes `nginx -t` fail and aborts the reload, which is easy to hit when
# standing up a new instance. Deploy first, get the cert, deploy again.
server {
    listen 80 default_server;
    server_name toggletravel-sentry.launchdarklydemos.com _;

    root /var/www/toggle-travel/public;

    # Let certbot answer the ACME challenge over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/toggle-travel/public;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    # Split deliberately. This app has NO build step, so filenames are never
    # content-hashed — marking JS/CSS `immutable` for 7d made every deploy
    # invisible to returning visitors until the cache expired. (Found the hard
    # way: a shipped sentry.js change that the browser refused to re-fetch.)
    #
    # JS/CSS: store but always revalidate. ETag/Last-Modified are already sent,
    # so this costs a 304 and no body transfer.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Images/fonts: safe to cache hard — a stale asset here is cosmetic, not
    # stale code. Only `expires` is set, so there is exactly one Cache-Control
    # header (using expires AND add_header emits two, which is ambiguous).
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Load generator streams NDJSON for several minutes — needs a long read timeout.
    location /api/demo/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # API and all dynamic routes -> Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
