# HTTP: serve ACME renewals, redirect everything else to HTTPS.
server {
    listen 80 default_server;
    server_name toggletravel.launchdarklydemos.com;

    # Let certbot renew over HTTP without a redirect getting in the way.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/toggle-travel/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name toggletravel.launchdarklydemos.com;

    ssl_certificate     /etc/letsencrypt/live/toggletravel.launchdarklydemos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toggletravel.launchdarklydemos.com/privkey.pem;

    root /var/www/toggle-travel/public;

    # Serve static files directly from Nginx (no telemetry noise on assets)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Load generator streams NDJSON for several minutes — needs a long read timeout.
    location /api/demo/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # API and all dynamic routes -> Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
